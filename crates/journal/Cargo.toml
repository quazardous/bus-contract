[package]
name = "bus-contract-journal"
version = "0.2.0"
description = "The journal contract of bus-contract: events of journaled points kept with a number, read again from one, delivered after the publisher has moved on. It owns its trait and types; a bus offers it through the core's typed capability lookup."
readme = "README.md"
include = ["src/", "README.md", "CHANGELOG.md", "LICENSE-*"]
keywords = ["event-bus", "contract", "hooks", "journal"]
categories = ["rust-patterns", "development-tools"]
documentation = "https://docs.rs/bus-contract-journal"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bus-contract = { version = "0.5.0", path = "../.." }

[dev-dependencies]
bus-contract-testkit = { path = "../testkit" }

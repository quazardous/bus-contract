[package]
name = "bus-contract-timings"
version = "0.2.0"
description = "The timings contract of bus-contract: how long listeners take, per point and per listener, and the passes over a point's budget. It owns its trait and types; a bus offers it through the core's typed capability lookup."
readme = "README.md"
include = ["src/", "README.md", "CHANGELOG.md", "LICENSE-*"]
keywords = ["event-bus", "contract", "hooks", "timings"]
categories = ["rust-patterns", "development-tools"]
documentation = "https://docs.rs/bus-contract-timings"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bus-contract = { version = "0.5.0", path = "../.." }

[dev-dependencies]
bus-contract-testkit = { path = "../testkit" }

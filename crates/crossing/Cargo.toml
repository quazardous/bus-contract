[package]
name = "bus-contract-crossing"
version = "0.2.0"
description = "The crossing contract of bus-contract: what may cross a process boundary and what it means when it does. It owns its trait and types; a bus offers it through the core's typed capability lookup."
readme = "README.md"
include = ["src/", "README.md", "CHANGELOG.md", "LICENSE-*"]
keywords = ["event-bus", "contract", "hooks", "ipc"]
categories = ["rust-patterns", "development-tools"]
documentation = "https://docs.rs/bus-contract-crossing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bus-contract = { version = "0.5.0", path = "../.." }
bus-contract-journal = { version = "0.2.0", path = "../journal" }

[dev-dependencies]
bus-contract-testkit = { path = "../testkit" }

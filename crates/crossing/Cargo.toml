[package]
name = "bus-contract-crossing"
version = "0.1.0"
description = "The crossing contract of bus-contract: what may cross a process boundary and what it means when it does. Today a facade over the bus-contract core, so code can switch its imports before the core 0.5 moves the capability here."
readme = "README.md"
include = ["src/", "README.md", "CHANGELOG.md", "LICENSE-*"]
keywords = ["event-bus", "contract", "hooks", "ipc"]
categories = ["rust-patterns", "development-tools"]
documentation = "https://docs.rs/bus-contract-crossing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bus-contract = { version = "0.4.4", path = "../.." }
bus-contract-journal = { version = "0.1.0", path = "../journal" }

[dev-dependencies]
bus-contract-testkit = { path = "../testkit" }

[package]
name = "bus-contract-defer"
version = "0.2.0"
description = "The defer contract of bus-contract: requests asked now, whose listeners run at the next drain on the same thread. It owns its trait and types; a bus offers it through the core's typed capability lookup."
readme = "README.md"
include = ["src/", "README.md", "CHANGELOG.md", "LICENSE-*"]
keywords = ["event-bus", "contract", "hooks", "deferred"]
categories = ["rust-patterns", "development-tools"]
documentation = "https://docs.rs/bus-contract-defer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bus-contract = { version = "0.5.0", path = "../.." }

[dev-dependencies]
bus-contract-testkit = { path = "../testkit" }

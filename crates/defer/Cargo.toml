[package]
name = "bus-contract-defer"
version = "0.1.0"
description = "The defer contract of bus-contract: requests asked now, whose listeners run at the next drain on the same thread. Today a facade over the bus-contract core, so code can switch its imports before the core 0.5 moves the capability here."
readme = "README.md"
include = ["src/", "README.md", "CHANGELOG.md", "LICENSE-*"]
keywords = ["event-bus", "contract", "hooks", "deferred"]
categories = ["rust-patterns", "development-tools"]
documentation = "https://docs.rs/bus-contract-defer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bus-contract = { version = "0.4.4", path = "../.." }

[dev-dependencies]
bus-contract-testkit = { path = "../testkit" }
